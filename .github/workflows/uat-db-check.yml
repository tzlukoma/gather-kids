name: UAT DB checks (quarantined)

# Quarantined by #506. This workflow used to apply migrations with
# scripts/db/apply_migrations_safe.sh, which writes public.schema_migration_ledger
# instead of supabase_migrations.schema_migrations. Do not restore it as a
# deploy path. See docs/CI_CD.md.

on:
  workflow_dispatch:

jobs:
  quarantined:
    name: quarantined
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy schema apply
        run: |
          echo "::error::uat-db-check is quarantined. Apply UAT schema with UAT DB deploy (supabase db push). See docs/CI_CD.md."
          exit 1
