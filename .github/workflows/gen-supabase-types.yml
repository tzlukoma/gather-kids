name: Generate Supabase Types

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to link (uat or production)
        required: true
        default: uat
        type: choice
        options:
          - uat
          - production
      open_pr:
        description: Open a PR with regenerated types (does not push to main)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  gen-types:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'

      - uses: ./.github/actions/setup-supabase-cli
        with:
          version: '2.116.0'

      - name: Resolve Supabase project
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LEGACY_UAT_URL: ${{ secrets.UAT_SUPABASE_URL }}
          LEGACY_PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
        run: |
          set -euo pipefail
          SUPABASE_URL="${SECRET_SUPABASE_URL:-}"
          if [ -z "$SUPABASE_URL" ] && [ "${{ inputs.environment }}" = "uat" ]; then
            SUPABASE_URL="${LEGACY_UAT_URL:-}"
          fi
          if [ -z "$SUPABASE_URL" ] && [ "${{ inputs.environment }}" = "production" ]; then
            SUPABASE_URL="${LEGACY_PROD_URL:-}"
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: Supabase URL secret missing for environment ${{ inputs.environment }}"
            exit 1
          fi
          PROJECT_ID=$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Generate types from linked project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          SUPABASE_PROJECT_ID="$PROJECT_ID" node scripts/gen-types.cjs

      - name: Upload generated types artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-types-${{ inputs.environment }}
          path: src/lib/database/supabase-types.ts

      - name: Open PR with regenerated types
        if: inputs.open_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="ci/gen-supabase-types-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/lib/database/supabase-types.ts
          git commit -m "chore: regenerate supabase types from ${{ inputs.environment }}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate supabase types from ${{ inputs.environment }}" \
            --body "Auto-generated supabase types from manual dispatch workflow."
