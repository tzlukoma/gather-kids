name: E2E Email Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-email:
    name: e2e-email
    runs-on: ubuntu-latest
    services:
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for MailHog
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8025/api/v2/messages; do sleep 1; done'

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: gatherKids
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          NEXT_PUBLIC_LOGIN_MAGIC_ENABLED: true
          NEXT_PUBLIC_LOGIN_PASSWORD_ENABLED: true

      - name: Start application
        run: npm start &
        env:
          CI: true
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILHOG_API_URL: http://localhost:8025
          NEXT_PUBLIC_LOGIN_MAGIC_ENABLED: true
          NEXT_PUBLIC_LOGIN_PASSWORD_ENABLED: true
          NEXT_PUBLIC_DEMO_MODE: false
          NEXT_PUBLIC_APP_NAME: gatherKids
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          PORT: 3000

      - name: Wait for application
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 1; done'

      - name: Run Playwright email tests
        run: npx playwright test --config=playwright-email.config.ts
        env:
          CI: true
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILHOG_API_URL: http://localhost:8025
          NEXT_PUBLIC_LOGIN_MAGIC_ENABLED: true
          NEXT_PUBLIC_DEMO_MODE: false
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-email-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
