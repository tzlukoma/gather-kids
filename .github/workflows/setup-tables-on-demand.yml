name: Setup All Tables (quarantined)

# Quarantined by #506. This workflow used to CREATE TABLE on UAT or production
# through ad-hoc SQL (execute_sql_reliable.sh / table-setup scripts), outside
# supabase db push. Do not restore it. See docs/CI_CD.md.

on:
  workflow_dispatch:

jobs:
  quarantined:
    name: quarantined
    runs-on: ubuntu-latest
    steps:
      - name: Refuse ad-hoc table setup
        run: |
          echo "::error::setup-tables-on-demand is quarantined. Schema changes belong in supabase/migrations and ship through UAT DB deploy, then Production DB deploy. See docs/CI_CD.md."
          exit 1
