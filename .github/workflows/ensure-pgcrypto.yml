name: Ensure pgcrypto Extension (quarantined)

# Quarantined by #506. A standalone CREATE EXTENSION workflow is not a schema
# path. Production DB deploy still runs scripts/db/ensure_pgcrypto.sh as a
# pre-step of approval-gated supabase db push. Do not call this workflow.

on:
  workflow_dispatch:

jobs:
  quarantined:
    name: quarantined
    runs-on: ubuntu-latest
    steps:
      - name: Refuse standalone extension apply
        run: |
          echo "::error::ensure-pgcrypto is quarantined as a standalone workflow. The extension pre-step runs only inside Production DB deploy. See docs/CI_CD.md."
          exit 1
