name: UAT DB deploy

on:
  workflow_call:
    inputs:
      dry_run:
        description: List migrations only, do not apply
        required: true
        type: boolean
      git_sha:
        description: Full 40-character main commit to verify
        required: true
        type: string
      deployment_url:
        description: Immutable UAT Vercel deployment URL for the selected commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: List migrations only, do not apply
        type: boolean
        default: false
      git_sha:
        description: Full 40-character main commit. Empty uses the selected ref.
        type: string
        required: false
        default: ''
      deployment_url:
        description: Immutable UAT Vercel deployment URL for the selected commit (https://….vercel.app)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy-uat-db:
    name: Apply migrations to UAT
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable main commit
        env:
          INPUT_SHA: ${{ inputs.git_sha }}
          RUN_SHA: ${{ github.sha }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          git fetch origin main
          SHA="${INPUT_SHA:-$RUN_SHA}"
          SHA=$(printf '%s' "$SHA" | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::git_sha must be a full 40-character commit SHA."
            exit 1
          fi
          git cat-file -e "${SHA}^{commit}"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::SHA is not on main. UAT verification only accepts main commits."
            exit 1
          fi
          if ! url=$(bash scripts/db/validate_uat_deployment_url.sh "$DEPLOYMENT_URL"); then
            echo "::error::deployment_url must be an immutable Vercel deployment origin, not a branch alias, production domain, or path."
            exit 1
          fi
          git checkout --detach "$SHA"
          echo "RESOLVED_SHA=$SHA" >> "$GITHUB_ENV"
          echo "UAT_DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'

      - uses: ./.github/actions/setup-supabase-cli
        with:
          version: '2.116.0'

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Resolve environment secrets
        shell: bash
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEGACY_DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LEGACY_SUPABASE_URL: ${{ secrets.UAT_SUPABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_URL="${SECRET_DATABASE_URL:-$LEGACY_DATABASE_URL}"
          SUPABASE_URL="${SECRET_SUPABASE_URL:-$LEGACY_SUPABASE_URL}"
          if [[ -z "$DATABASE_URL" || -z "$SUPABASE_URL" ]]; then
            echo "ERROR: DATABASE_URL and SUPABASE_URL must be set in the uat environment."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"sslmode="* ]]; then
            echo "ERROR: DATABASE_URL must include sslmode=require."
            exit 1
          fi
          PROJECT_ID=$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Verify selected UAT deployment before database changes
        env:
          UAT_DEPLOYMENT_URL: ${{ env.UAT_DEPLOYMENT_URL }}
        run: |
          set -euo pipefail
          set +e
          version_code=$(curl -sS -o /tmp/uat-preflight-version.json -w '%{http_code}' "$UAT_DEPLOYMENT_URL/api/version")
          version_curl=$?
          set -e
          if [[ "$version_curl" -ne 0 || "$version_code" != "200" ]]; then
            {
              echo "## UAT DB deploy"
              echo ""
              echo "- **State:** failed"
              echo "- **SHA:** \`$RESOLVED_SHA\`"
              echo "- **Verified deployment URL:** $UAT_DEPLOYMENT_URL"
              echo "- **Reason:** /api/version returned HTTP ${version_code:-curl-failed} before database changes"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GET /api/version did not return HTTP 200. No database changes were made."
            exit 1
          fi

          set +e
          node scripts/db/verify_release_version.mjs /tmp/uat-preflight-version.json "$RESOLVED_SHA" '' uat preflight > /tmp/uat-preflight.json
          verify_status=$?
          set -e
          if [[ ! -s /tmp/uat-preflight.json ]]; then
            echo "::error::UAT deployment preflight did not return a result. No database changes were made."
            exit 1
          fi

          state=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/uat-preflight.json','utf8')).state || '')")
          reason=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/uat-preflight.json','utf8')).reason || '')")
          expected=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-preflight.json','utf8')); process.stdout.write(b.expectedMigration ?? '')")
          applied=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-preflight.json','utf8')); process.stdout.write(b.appliedMigration ?? '')")
          in_sync=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-preflight.json','utf8')); process.stdout.write(String(b.inSync))")
          if [[ "$verify_status" -ne 0 || "$state" != "UAT deployment verified" ]]; then
            {
              echo "## UAT DB deploy"
              echo ""
              echo "- **State:** failed"
              echo "- **SHA:** \`$RESOLVED_SHA\`"
              echo "- **Verified deployment URL:** $UAT_DEPLOYMENT_URL"
              echo "- **Expected migration:** \`$expected\`"
              echo "- **Applied migration:** \`$applied\`"
              echo "- **inSync:** $in_sync"
              echo "- **Reason:** $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::UAT deployment does not identify the selected UAT commit. No database changes were made."
            exit 1
          fi
          echo "PREFLIGHT_EXPECTED_MIGRATION=$expected" >> "$GITHUB_ENV"
          echo "PREFLIGHT_APPLIED_MIGRATION=$applied" >> "$GITHUB_ENV"
          echo "PREFLIGHT_IN_SYNC=$in_sync" >> "$GITHUB_ENV"

      - name: Dry-run migrations (optional)
        if: inputs.dry_run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run --include-all --yes
          {
            echo "## UAT DB deploy"
            echo ""
            echo "- **State:** dry run — not UAT verified"
            echo "- **SHA:** \`$RESOLVED_SHA\`"
            echo "- **Project:** \`$PROJECT_ID\`"
            echo "- **Verified deployment URL:** $UAT_DEPLOYMENT_URL"
            echo "- **Expected migration:** \`$PREFLIGHT_EXPECTED_MIGRATION\`"
            echo "- **Applied migration:** \`$PREFLIGHT_APPLIED_MIGRATION\`"
            echo "- **inSync:** $PREFLIGHT_IN_SYNC"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations to UAT
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          chmod +x scripts/db/apply_migrations_cli.sh
          scripts/db/apply_migrations_cli.sh "$PROJECT_ID" "$SUPABASE_ACCESS_TOKEN" "$SUPABASE_DB_PASSWORD"

      - name: Run FK integrity checks
        if: ${{ !inputs.dry_run }}
        run: |
          chmod +x scripts/db/check_fks.sh
          scripts/db/check_fks.sh "$DATABASE_URL"

      - name: Read applied migration
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          LATEST=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c \
            "SELECT version FROM supabase_migrations.schema_migrations WHERE version ~ '^[0-9]+\$' ORDER BY version::numeric DESC LIMIT 1")
          COUNT=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c \
            "SELECT count(*) FROM supabase_migrations.schema_migrations")
          if [[ -z "$LATEST" || -z "$COUNT" ]]; then
            echo "::error::Could not read supabase_migrations.schema_migrations."
            exit 1
          fi
          echo "APPLIED_MIGRATION=$LATEST" >> "$GITHUB_ENV"
          echo "APPLIED_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Verify deployed UAT app
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          base="$UAT_DEPLOYMENT_URL"

          set +e
          version_code=$(curl -sS -o /tmp/uat-version.json -w '%{http_code}' "$base/api/version")
          version_curl=$?
          set -e
          if [[ "$version_curl" -ne 0 || "$version_code" != "200" ]]; then
            echo "::error::GET /api/version returned HTTP $version_code."
            {
              echo "## UAT DB deploy"
              echo ""
              echo "- **State:** failed"
              echo "- **SHA:** \`$RESOLVED_SHA\`"
              echo "- **Verified deployment URL:** $base"
              echo "- **Reason:** /api/version returned HTTP $version_code"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          set +e
          node scripts/db/verify_release_version.mjs /tmp/uat-version.json "$RESOLVED_SHA" "$APPLIED_MIGRATION" > /tmp/uat-release.json
          verify_status=$?
          set -e
          if [[ ! -s /tmp/uat-release.json ]]; then
            echo "::error::Release check did not return a result."
            exit 1
          fi

          state=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')).state)")
          reason=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')).reason)")
          app=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')); process.stdout.write(b.app ?? '')")
          expected=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')); process.stdout.write(b.expectedMigration ?? '')")
          applied=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')); process.stdout.write(b.appliedMigration ?? '')")
          count=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')); process.stdout.write(String(b.appliedCount ?? ''))")
          in_sync=$(node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/uat-release.json','utf8')); process.stdout.write(String(b.inSync))")

          health="not run"
          if [[ "$verify_status" -eq 0 ]]; then
            set +e
            health_code=$(curl -sS -o /tmp/uat-health.json -w '%{http_code}' "$base/api/health")
            health_curl=$?
            set -e
            health_status=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/uat-health.json','utf8')).status||'')}catch{process.stdout.write('')}")
            if [[ "$health_curl" -ne 0 || "$health_code" != "200" || "$health_status" != "ok" ]]; then
              state="failed"
              reason="GET /api/health did not return status ok"
              verify_status=1
              health="failed"
            else
              health="ok"
            fi
          fi

          {
            echo "## UAT DB deploy"
            echo ""
            echo "- **State:** $state"
            echo "- **SHA:** \`$RESOLVED_SHA\`"
            echo "- **App:** \`$app\`"
            echo "- **Verified deployment URL:** $base"
            echo "- **Expected migration:** \`$expected\`"
            echo "- **Applied migration:** \`$applied\`"
            echo "- **Applied count:** $count"
            echo "- **Database applied migration:** \`$APPLIED_MIGRATION\`"
            echo "- **Database applied count:** $APPLIED_COUNT"
            echo "- **inSync:** $in_sync"
            echo "- **Health:** $health"
            echo "- **Reason:** $reason"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$state" != "UAT verified" ]]; then
            echo "::error::$state — $reason"
            exit 1
          fi

      - name: Snapshot schema (optional artifact)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p snapshots
          SNAPSHOT="snapshots/schema-uat-$(date +'%Y%m%d-%H%M%S').sql"
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump -f "$SNAPSHOT" --linked

      - name: Upload schema snapshot
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: uat-schema-snapshot
          path: snapshots/
          retention-days: 14
