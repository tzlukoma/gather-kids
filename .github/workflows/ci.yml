name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'
      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            npm-debug.log*
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'
      - name: Build
        run: npm run build
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .next/trace
          if-no-files-found: ignore

  db-fk:
    name: db-fk
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 54322 -U postgres && break
            sleep 1
          done

      - name: Bootstrap CI Postgres for Supabase migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f scripts/db/bootstrap_ci_postgres.sql

      - name: Apply SQL migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No SQL migrations found under supabase/migrations"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Applying $f"
            psql -h localhost -p 54322 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 \
              -f "$f"
          done

      - name: Run FK integrity checks
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          chmod +x scripts/db/check_fks.sh
          scripts/db/check_fks.sh

      - name: Check the household link is not browser-writable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/db/check_household_link_writes.sql

      - name: Check RLS read policies decide correctly
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/db/check_rls_reads.sql

      - name: Check Bible Bee assignments are created for the right callers only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/db/check_bible_bee_assignments.sql

      - name: Check schema migration status RPC
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/db/check_schema_migration_status.sql

      - uses: ./.github/actions/setup-supabase-cli
        with:
          version: '2.116.0'

      # `supabase gen types` pulls postgres-meta from ECR Public, which
      # rate-limits anonymous pulls per source IP. CI runners share NAT
      # addresses, so `toomanyrequests: Rate exceeded` lands here regularly and
      # says nothing about the schema. It is a throttle, not an exhausted quota,
      # so a short backoff clears it.
      #
      # Only exit 2 (generation failed) is retried. Exit 1 means the types are
      # genuinely out of sync, and retrying that would reprint the diff three
      # times and triple the runtime of the failure this job exists to catch.
      - name: Check Supabase types match migrated schema
        run: |
          chmod +x scripts/db/check_types_sync.sh
          for attempt in 1 2 3; do
            set +e
            scripts/db/check_types_sync.sh "postgresql://postgres:postgres@localhost:54322/postgres"
            status=$?
            set -e
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Type generation failed on attempt $attempt (transient registry error); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Type generation failed on all 3 attempts. If this is still a registry throttle, re-run the job; if it is persistent, the postgres-meta image or the pinned Supabase CLI version is the place to look."
          exit 1

  schema-change:
    name: schema-change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a schema declaration when migrations change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/db/check_schema_change_declaration.sh

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            refactor
            test
            build
            perf
            revert
          requireScope: false

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          checkout: 'false'
      - name: Validate in-app help
        run: npm run docs:validate
      - name: Changelog parser smoke
        run: npm run help:parse-changelog
