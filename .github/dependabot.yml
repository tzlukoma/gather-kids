# Dependabot configuration — MAINT-20
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Limit open PRs to keep the queue manageable
    open-pull-requests-limit: 10
    # Keep packages that must move in lockstep in one PR.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      commitlint:
        patterns:
          - "@commitlint/cli"
          - "@commitlint/config-conventional"
      # Group routine updates, but isolate Supabase because @supabase/ssr
      # has a strict @supabase/supabase-js peer and both can tighten DAL types.
      minor-and-patch:
        exclude-patterns:
          - "@supabase/ssr"
          - "@supabase/supabase-js"
        update-types:
          - "minor"
          - "patch"
    # Revisit these ignores when their upstream peer constraints are lifted:
    # @genkit-ai/next@1.42.0 requires Zod 3, and ts-jest@29.4.12
    # requires TypeScript <7.
    ignore:
      - dependency-name: "zod"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
