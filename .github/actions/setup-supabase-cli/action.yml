name: Setup Supabase CLI
description: Install a pinned Supabase CLI version and add it to PATH

inputs:
  version:
    description: Supabase CLI version to install
    required: false
    default: '2.116.0'

runs:
  using: composite
  steps:
    - name: Install Supabase CLI
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        mkdir -p "$HOME/.bin"
        curl -fsSL "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" \
          | tar -xz -C "$HOME/.bin"
        chmod +x "$HOME/.bin/supabase"
        echo "$HOME/.bin" >> "$GITHUB_PATH"
        echo "Supabase CLI version:"
        "$HOME/.bin/supabase" --version
